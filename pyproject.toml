[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usptrader"
version = "0.1.0"
description = "US-market paper trader that behaves like an Indian resident's LRS cash account"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.40",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "moto[dynamodb]>=5"]

[project.scripts]
usptrader = "usptrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
